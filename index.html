<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuro Neko - System Confirmation</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --primary-color: #2563eb;
            --success-color: #16a34a;
            --danger-color: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            text-align: center;
            transition: all 0.3s ease;
        }

        .icon-container {
            font-size: 56px;
            margin-bottom: 20px;
            line-height: 1;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 24px;
        }

        .sub-text {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 0;
        }

        .spinner {
            display: inline-block;
            width: 44px;
            height: 44px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card" id="status-card">
        <div class="spinner"></div>
        <h1>กำลังดำเนินการ...</h1>
        <p>ระบบกำลังส่งคำสั่งไปยัง Blynk Cloud กรุณารอสักครู่</p>
    </div>

    <script>
        const V_PIN = 'V6';

        const UI_STATES = {
            yes: {
                value: '1',
                icon: '🎬',
                title: 'ยืนยันการทำรายการสำเร็จ!',
                message: 'ระบบกำลังเริ่มบันทึกวิดีโอ 5 วินาที และจะส่งอีเมลรายงานสรุปให้คุณในลำดับถัดไป'
            },
            no: {
                value: '2',
                icon: '❌',
                title: 'ยกเลิกการบันทึกวิดีโอ',
                message: 'ข้ามขั้นตอนการบันทึกวิดีโอเรียบร้อยแล้ว ระบบจะบันทึกสถานะตามปกติ'
            },
            invalid: {
                icon: '⚠️',
                title: 'คำสั่งไม่ถูกต้อง',
                message: 'ไม่พบพารามิเตอร์ action ที่ถูกต้อง กรุณาใช้ลิงก์ที่ได้รับจากอีเมล'
            }
        };

        function renderUI(iconHtml, title, message, subText = 'คุณสามารถปิดหน้านี้ได้เลย') {
            const card = document.getElementById('status-card');
            card.innerHTML = `
                <div class="icon-container">${iconHtml}</div>
                <h1>${title}</h1>
                <p>${message}</p>
                ${subText ? `<p class="sub-text">${subText}</p>` : ''}
            `;
        }

        async function sendBlynkCommand(value) {
            const targetUrl = `/api/blynk?pin=${V_PIN}&value=${value}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);
        
            try {
                const response = await fetch(targetUrl, { signal: controller.signal });
                clearTimeout(timeoutId);
        
                if (response.ok) {
                    return true;
                }
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || `HTTP ${response.status}`);
            } catch (err) {
                clearTimeout(timeoutId);
                throw new Error(err.name === 'AbortError' ? 'Connection Timeout' : err.message);
            }
        }

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const action = urlParams.get('action');

            const state = UI_STATES[action];
            if (!state || !state.value) {
                renderUI(UI_STATES.invalid.icon, UI_STATES.invalid.title, UI_STATES.invalid.message, '');
                return;
            }

            try {
                await sendBlynkCommand(state.value);
                renderUI(state.icon, state.title, state.message);
            } catch (error) {
                console.error('Blynk Update Error:', error);
                renderUI(
                    '⚠️',
                    'เกิดข้อผิดพลาดในการเชื่อมต่อ',
                    `ไม่สามารถส่งคำสั่งไปยัง Blynk Cloud ได้ (${error.message}) กรุณาตรวจสอบการเชื่อมต่อระบบ`,
                    'ลองรีเฟรช (F5) หน้านี้อีกครั้ง'
                );
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
